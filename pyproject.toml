[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hallucination-grounder"
version = "0.1.0"
description = "Grounding verifier comparing factual claims in LLM outputs against local AST symbols, filesystem records, and verified documents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-hallucination-grounder = "agent_hallucination_grounder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_hallucination_grounder*"]
